name: MoonBit quality checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon fmt && moon info && git diff --exit-code
      - run: moon check
      - run: moon test --target wasm-gc
      - run: moon test --target js
      - run: moon build --target js
      - name: Refresh actual browser engine
        run: |
          engine=$(find _build/js/debug/build/cmd/web -type f -name '*.js' | head -n 1)
          test -n "$engine"
          cp "$engine" web/engine.mjs
      - run: node tools/test-demo.mjs
      - run: node tools/test-cli.mjs
      - run: node tools/test-network.mjs
      - run: node tools/test-starttls.mjs
      - run: node tools/test-snapshot.mjs
      - name: Independent GreenMail UID export
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/com/icegreen/greenmail-standalone/2.1.13/greenmail-standalone-2.1.13.jar -o "$RUNNER_TEMP/greenmail.jar"
          echo "21b361e46e8ffe83afe7915a2b01231c4a163c8d0fa5de607e32ed19732d908d  $RUNNER_TEMP/greenmail.jar" | sha256sum --check
          GREENMAIL_JAR="$RUNNER_TEMP/greenmail.jar" node examples/run-uid-snapshot.mjs | tee evidence/uid-snapshot-20260923/ci-greenmail.json
      - run: node tools/robustness.mjs
      - run: node tools/benchmark.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: quality-evidence
          path: evidence/
